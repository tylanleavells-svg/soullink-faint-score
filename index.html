<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Uncivilized Soul Link</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 20px;
    background: radial-gradient(circle at top, #0f1628, #060912);
    font-family: "Press Start 2P", sans-serif;
    color: white;
}

h1 {
    text-align: center;
    font-size: 1rem;
    margin-bottom: 20px;
}

.board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}

/* PLAYER CARD */
.player {
    background: #e9efff;
    color: black;
    border-radius: 12px;
    padding: 12px;
    border: 3px solid #2b4cff;
}

/* HEADER */
.player-header {
    display: flex;
    gap: 14px;
    align-items: center;
    background: #2f55ff;
    color: white;
    padding: 12px;
    border-radius: 10px;
}

/* PROFILE IMAGE */
.player-header img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 14px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    border: none;
}

.player-header div {
    font-size: 0.7rem;
}

/* INPUT */
input {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    border-radius: 6px;
    border: 2px solid #2b4cff;
    font-family: inherit;
    font-size: 0.55rem;
}

/* BUTTONS */
button {
    width: 100%;
    margin-top: 6px;
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.55rem;
}

.add { background:#2b4cff; color:white; }
.remove { background:#ff4b4b; color:white; }

/* GRID */
.deaths {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

/* POKÉMON CARD */
.death {
    background: white;
    border-radius: 14px;
    padding: 10px;
    text-align: center;
    font-size: 0.55rem;
    cursor: grab;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;

    border: 2px solid #2b4cff;

    transition: transform 0.15s ease;
}

.death:hover {
    transform: scale(1.05);
}

/* BIG SPRITES */
.death img {
    width: 180px;
    height: 180px;
    image-rendering: pixelated;
}

.counter {
    margin-top: 8px;
    text-align: center;
    font-size: 0.6rem;
}
</style>
</head>

<body>

<h1>Uncivilized Soul Link</h1>

<div class="board">

<!-- PLAYERS -->
<div class="player" id="player1">
    <div class="player-header">
        <img src="https://i.imgur.com/H1Ee8Rp.png">
        <div>KuroPlays</div>
    </div>
    <input id="input-player1">
    <button class="add">Add</button>
    <button class="remove">Remove</button>
    <div class="deaths"></div>
    <div class="counter">0</div>
</div>

<div class="player" id="player2">
    <div class="player-header">
        <img src="https://i.imgur.com/vBYrvOU.png">
        <div>Blackychan</div>
    </div>
    <input id="input-player2">
    <button class="add">Add</button>
    <button class="remove">Remove</button>
    <div class="deaths"></div>
    <div class="counter">0</div>
</div>

<div class="player" id="player3">
    <div class="player-header">
        <img src="https://i.imgur.com/3RTTK31.png">
        <div>Dboijr</div>
    </div>
    <input id="input-player3">
    <button class="add">Add</button>
    <button class="remove">Remove</button>
    <div class="deaths"></div>
    <div class="counter">0</div>
</div>

<div class="player" id="player4">
    <div class="player-header">
        <img src="https://i.imgur.com/Ni1rhD4.png">
        <div>Slxsher</div>
    </div>
    <input id="input-player4">
    <button class="add">Add</button>
    <button class="remove">Remove</button>
    <div class="deaths"></div>
    <div class="counter">0</div>
</div>

<div class="player" id="player5">
    <div class="player-header">
        <img src="https://i.imgur.com/7C0CuBa.png">
        <div>Jerri</div>
    </div>
    <input id="input-player5">
    <button class="add">Add</button>
    <button class="remove">Remove</button>
    <div class="deaths"></div>
    <div class="counter">0</div>
</div>

</div>

<script>
const players = ["player1","player2","player3","player4","player5"];

let data = {};
let spriteMap = {};

document.addEventListener("DOMContentLoaded", async () => {

    await loadDex();

    players.forEach(id => {
        data[id] = JSON.parse(localStorage.getItem(id)) || [];

        const el = document.getElementById(id);

        el.querySelector(".add").onclick = () => {
            const input = el.querySelector("input");
            if (!input.value) return;

            data[id].push(input.value);
            save(id);
            input.value = "";
            render(id);
        };

        el.querySelector(".remove").onclick = () => {
            data[id].pop();
            save(id);
            render(id);
        };

        const box = el.querySelector(".deaths");

        box.addEventListener("dragover", e => e.preventDefault());

        box.addEventListener("drop", e => {
            const d = JSON.parse(e.dataTransfer.getData("text"));

            const moved = data[d.from].splice(d.index, 1)[0];
            data[id].push(moved);

            save(d.from);
            save(id);

            render(d.from);
            render(id);
        });
    });

    players.forEach(render);
});

// RENDER (FIXED SPRITES)
function render(id) {
    const box = document.querySelector(`#${id} .deaths`);
    const counter = document.querySelector(`#${id} .counter`);

    box.innerHTML = "";

    data[id].forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "death";
        div.draggable = true;

        const key = p.toLowerCase();
        const spriteId = spriteMap[key] || 1;

        div.innerHTML = `
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${spriteId}.png">
            <div>${p}</div>
        `;

        div.onclick = () => {
            data[id].splice(i, 1);
            save(id);
            render(id);
        };

        div.addEventListener("dragstart", e => {
            e.dataTransfer.setData("text", JSON.stringify({
                from: id,
                index: i
            }));
        });

        box.appendChild(div);
    });

    counter.textContent = data[id].length;
}

// SAVE
function save(id) {
    localStorage.setItem(id, JSON.stringify(data[id]));
}

// POKEDEX + SPRITE MAP
async function loadDex() {
    const res = await fetch("https://pokeapi.co/api/v2/pokemon?limit=1010");
    const json = await res.json();

    const list = document.createElement("datalist");
    list.id = "dexlist";

    json.results.forEach((p, index) => {
        const name = p.name.charAt(0).toUpperCase() + p.name.slice(1);

        spriteMap[p.name.toLowerCase()] = index + 1;

        const opt = document.createElement("option");
        opt.value = name;
        list.appendChild(opt);
    });

    document.body.appendChild(list);

    document.querySelectorAll("input").forEach(i => {
        i.setAttribute("list", "dexlist");
    });
}
</script>

</body>
</html>
