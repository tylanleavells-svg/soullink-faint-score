<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uncivilized Soul Link</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ui-scale:1}
*,*:before,*:after{box-sizing:border-box}
body{
margin:0;padding:10px;
background:radial-gradient(circle at top,#0f1628,#060912);
font-family:"Press Start 2P",sans-serif;color:#fff;
transform:scale(var(--ui-scale));transform-origin:top left;
width:calc(100%/var(--ui-scale));
}
h1{text-align:center;font-size:clamp(.8rem,2vw,1rem)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;width:100%}
.player{background:#e9efff;color:#000;border-radius:12px;padding:12px;border:3px solid #2b4cff}
.player-header{display:flex;gap:14px;align-items:center;background:#2f55ff;color:#fff;padding:12px;border-radius:10px}
.player-header img{width:clamp(70px,8vw,120px);height:clamp(70px,8vw,120px);object-fit:cover;border-radius:14px}
.player-header div{font-size:clamp(.55rem,1vw,.7rem)}
input,button{width:100%;margin-top:8px;padding:8px;border-radius:6px;font-family:inherit;font-size:clamp(.42rem,.75vw,.55rem)}
input{border:2px solid #2b4cff}
button{border:none;cursor:pointer}
.add{background:#2b4cff;color:#fff}.remove{background:#ff4b4b;color:#fff}
.deaths{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.death{background:#fff;border:2px solid #2b4cff;border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;font-size:clamp(.42rem,.75vw,.55rem)}
.death img{width:min(100%,140px);height:auto;image-rendering:pixelated}
.counter{text-align:center;margin-top:8px;font-size:.6rem}
</style></head><body>
<h1>Uncivilized Soul Link</h1>
<div class="board">
<div class="player" id="player1"><div class="player-header"><img src="https://i.imgur.com/H1Ee8Rp.png"><div>KuroPlays</div></div><input id="input-player1"><button class="add">Add</button><button class="remove">Remove</button><div class="deaths"></div><div class="counter">0</div></div><div class="player" id="player2"><div class="player-header"><img src="https://i.imgur.com/vBYrvOU.png"><div>Blackychan</div></div><input id="input-player2"><button class="add">Add</button><button class="remove">Remove</button><div class="deaths"></div><div class="counter">0</div></div><div class="player" id="player3"><div class="player-header"><img src="https://i.imgur.com/3RTTK31.png"><div>Dboijr</div></div><input id="input-player3"><button class="add">Add</button><button class="remove">Remove</button><div class="deaths"></div><div class="counter">0</div></div><div class="player" id="player4"><div class="player-header"><img src="https://i.imgur.com/Ni1rhD4.png"><div>Slxsher</div></div><input id="input-player4"><button class="add">Add</button><button class="remove">Remove</button><div class="deaths"></div><div class="counter">0</div></div><div class="player" id="player5"><div class="player-header"><img src="https://i.imgur.com/7C0CuBa.png"><div>Jerri</div></div><input id="input-player5"><button class="add">Add</button><button class="remove">Remove</button><div class="deaths"></div><div class="counter">0</div></div>
</div>
<script>
const players=["player1","player2","player3","player4","player5"];
let data={},spriteMap={};
document.addEventListener("DOMContentLoaded",async()=>{
 await loadDex();
 players.forEach(id=>{
  data[id]=JSON.parse(localStorage.getItem(id))||[];
  const el=document.getElementById(id);
  el.querySelector(".add").onclick=()=>{const i=el.querySelector("input");if(!i.value)return;data[id].push(i.value);save(id);i.value="";render(id);}
  el.querySelector(".remove").onclick=()=>{data[id].pop();save(id);render(id);}
  const box=el.querySelector(".deaths");
  box.addEventListener("dragover",e=>e.preventDefault());
  box.addEventListener("drop",e=>{const d=JSON.parse(e.dataTransfer.getData("text"));const m=data[d.from].splice(d.index,1)[0];data[id].push(m);save(d.from);save(id);render(d.from);render(id);});
 });
 players.forEach(render);
});
function render(id){
 const box=document.querySelector(`#${id} .deaths`),counter=document.querySelector(`#${id} .counter`);
 box.innerHTML="";
 data[id].forEach((p,i)=>{
  const d=document.createElement("div");d.className="death";d.draggable=true;
  const sid=spriteMap[p.toLowerCase()]||1;
  d.innerHTML=`<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${sid}.png"><div>${p}</div>`;
  d.onclick=()=>{data[id].splice(i,1);save(id);render(id);}
  d.addEventListener("dragstart",e=>e.dataTransfer.setData("text",JSON.stringify({from:id,index:i})));
  box.appendChild(d);
 });
 counter.textContent=data[id].length;
}
const save=id=>localStorage.setItem(id,JSON.stringify(data[id]));
async function loadDex(){
 const res=await fetch("https://pokeapi.co/api/v2/pokemon?limit=1010");
 const json=await res.json();
 const list=document.createElement("datalist");list.id="dexlist";
 json.results.forEach((p,i)=>{spriteMap[p.name]=i+1;const o=document.createElement("option");o.value=p.name.charAt(0).toUpperCase()+p.name.slice(1);list.appendChild(o);});
 document.body.appendChild(list);document.querySelectorAll("input").forEach(i=>i.setAttribute("list","dexlist"));
}
</script></body></html>
